<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三典修仙录 · 大荒桃源镇</title>
<style>
:root{--bg:#10171a;--panel:#192327;--ink:#e8e2d0;--dim:#8f9a98;--qi:#d9a441;--lo:#4f9f86;--hong:#d07a8c;--hp:#c4553f;--xin:#6fa3c7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#21332f,var(--bg) 60%) fixed;color:var(--ink);font:17px/1.9 "Noto Serif SC","Songti SC","STSong","SimSun",serif;padding:16px}
#app{max-width:680px;margin:0 auto}
header{text-align:center;padding:12px 0 4px}
h1{margin:0;font-size:2rem;letter-spacing:.4em;font-weight:900;background:linear-gradient(90deg,var(--qi),var(--lo),var(--hong));-webkit-background-clip:text;background-clip:text;color:transparent}
#chap{margin:4px 0 0;color:var(--dim);letter-spacing:.2em;font-size:.9rem}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.st b{display:block;font-size:.75rem;font-weight:400;color:var(--dim);text-align:center}
.st i{display:block;height:6px;background:#0c1113;border-radius:3px;overflow:hidden}
.st u{display:block;height:100%;width:0;background:var(--hp);transition:width .4s}
#b-xin{background:var(--xin)}#b-qi{background:var(--qi)}#b-lo{background:var(--lo)}#b-hong{background:var(--hong)}
#scene{background:var(--panel);border-left:3px solid var(--qi);padding:18px 20px;min-height:220px;white-space:pre-line;border-radius:2px}
#scene[data-b=lo]{border-color:var(--lo)}
#scene[data-b=hong]{border-color:var(--hong)}
#scene h2{margin:0 0 8px;font-size:1.15rem;letter-spacing:.15em}
#scene p{margin:0}
#choices{display:grid;gap:10px;margin-top:14px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid #3a4a4a;padding:10px 14px;text-align:left;cursor:pointer;border-radius:2px;transition:background .2s,border-color .2s}
button:hover,button:focus-visible{background:#233236;border-color:var(--qi);outline:none}
button small{display:block;color:var(--dim);font-size:.8rem;line-height:1.5}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:480px){body{font-size:16px}h1{font-size:1.5rem}}
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>三典修仙录</h1>
    <p id="chap">序章</p>
  </header>
  <section id="stats" aria-label="状态与天心值">
    <div class="st"><b>气血</b><i><u id="b-hp"></u></i></div>
    <div class="st"><b>心境</b><i><u id="b-xin"></u></i></div>
    <div class="st"><b>齐天</b><i><u id="b-qi"></u></i></div>
    <div class="st"><b>龙图</b><i><u id="b-lo"></u></i></div>
    <div class="st"><b>红楼</b><i><u id="b-hong"></u></i></div>
  </section>
  <section id="scene" aria-live="polite"></section>
  <div id="choices"></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const cl = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
// 齐天=西游 龙图=三国 红楼=红楼梦
const S = { hp: 100, xin: 100, qi: 0, lo: 0, hong: 0, dao: '', st: '', run: 1, af: new Set(), gem: 0, M: 1, m1: 0, m2: 0, realm: '', ally: '', an: new Set() };
const add = (k, n) => { S[k] = cl(S[k] + n, 0, 10); };

function hud() {
  S.hp = cl(S.hp); S.xin = cl(S.xin);
  $('b-hp').style.width = S.hp + '%';
  $('b-xin').style.width = S.xin + '%';
  ['qi', 'lo', 'hong'].forEach(k => { $('b-' + k).style.width = S[k] * 10 + '%'; });
}

function show(chap, book, title, text, choices) {
  $('chap').textContent = chap + (S.realm ? ' · ' + S.realm : '');
  const s = $('scene');
  s.dataset.b = book;
  s.innerHTML = '<h2></h2><p></p>';
  s.firstChild.textContent = title;
  s.lastChild.textContent = text;
  const c = $('choices');
  c.innerHTML = '';
  choices.forEach(([label, fn, sub]) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (sub) { const m = document.createElement('small'); m.textContent = sub; b.appendChild(m); }
    b.onclick = fn;
    c.appendChild(b);
  });
  hud();
}

const EZ = { on: 1 }; // 难度：1 轻松（默认）/ 0 标准
// 通用回合制战斗
function fight(f, done) {
  const e = { hp: Math.round(f.hp * (S.af.has('连环锁铁') ? 1.3 : 1) * (S.af.has('汉室倾颓') ? 1.2 : 1)), k: 0 }; e.max = e.hp;
  if (EZ.on) { e.hp = e.max = Math.round(e.hp * .7); S.hp = cl(S.hp + 40); S.xin = cl(S.xin + 30); }
  const bossy = /魔|神|仙|佛|魂|幽冥|如来|乱帝|三相尊|锁艳尊|执行者|长老|联军|水寨|金刚|杀手/.test(f.name); // 魔神级敌人：额外削弱
  if (bossy) e.hp = e.max = Math.round(e.max * .8);
  const turn = msg => {
    if (S.hp <= 0) {
      S.hp = EZ.on ? 100 : 60; S.xin = Math.max(S.xin, 40); if (!EZ.on) e.hp = e.max;
      return show(f.chap, f.book, '力竭', '你气血耗尽，一缕灵光护住心脉。你缓缓起身，再战！', [['再战', () => turn('')], ['放弃本世 · 返回因果天盘', tianpan, '词条太难时，可调整后重入红尘']]);
    }
    if (e.hp <= 0) return show(f.chap, f.book, '得胜', msg, [['继续', done]]);
    e.k = Math.random() * 3 | 0;
    e.hk = S.af.has('假作真时') && Math.random() < .5 ? (e.k + 1 + (Math.random() * 2 | 0)) % 3 : e.k;
    show(f.chap, f.book, `${f.name}　${e.hp}/${e.max}`, (f.hint ? f.hint(e) + '\n' : '') + msg,
      f.moves.filter(m => !(S.af.has('无空劫') && ['神通变化', '七十二变'].includes(m.l))).map(m => [m.l + (EZ.on && f.hint && f.moves.indexOf(m) === e.hk ? '　★' : ''), () => {
        let r = m.r(e);
        if (e.hp > 0) {
          const h = S.hp; r += '\n' + f.act(e);
          const rate = 1 - (EZ.on ? .5 : 1) * (bossy ? .75 : 1);
          if (rate > 0) { const cut = Math.round((h - S.hp) * rate); if (cut > 0) { S.hp += cut; r += `（${EZ.on ? '轻松模式' : '魔神衰弱'}，减免 ${cut} 点）`; } }
          const x = S.af.has('九九真难') ? Math.round((h - S.hp) * .5) : 0;
          if (x > 0) { S.hp -= x; r += `（九九真难，额外 ${x} 点）`; }
          const y = S.af.has('千红同悲') && S.ally ? Math.round((h - S.hp) * .25) : 0;
          if (y > 0) { S.hp -= y; r += `（共感同伤，额外 ${y} 点）`; }
          if (S.af.has('白骨盈野')) { S.hp -= 3; r += '（死气侵蚀 -3）'; }
        }
        turn(r);
      }, m.s]));
  };
  turn(f.intro);
}

function intro() {
  show('序章', 'qi', '大荒桃源镇',
    '天地初判，大荒之中有一桃源镇。镇后水帘瀑布、镇中桃园水陆埠、镇外警幻仙林，各藏一部奇书的天机。\n你将在此踏上修仙之路。' +
    (S.run > 1 ? `\n\n（第 ${S.run} 世 · 你带着前世的因果重入红尘）` : ''), [['苏醒 · 轻松模式（推荐）', () => { EZ.on = 1; ch1(); }, '敌人更弱、伤害减半、每战回血，并用 ★ 标出建议招式'], ['苏醒 · 挑战模式', () => { EZ.on = 0; ch1(); }, '原版难度，容错很低']]);
}

/* 第一章 · 西游：降伏心猿 */
const foe1 = {
  chap: '第一章 · 石破天惊', book: 'qi', name: '赤尻马猴（心魔）', hp: 70,
  intro: '水帘之后，灵力凝成一只赤尻马猴，龇牙狂笑，正是你自己的心魔。\n【战意】伤害高但耗心境；【静心】减伤并回复心境。心境低于 30，心魔便会狂躁。',
  moves: [
    { l: '战意·出拳', s: '伤害高，心境 -10', r: e => { const d = 20 + (Math.random() * 8 | 0); e.hp -= d; S.xin -= S.af.has('紧箍悬顶') ? 20 : 10; S.st = '战'; return `你战意沸腾，一拳击出，造成 ${d} 点伤害。`; } },
    { l: '静心·守息', s: '受伤减半，心境 +15', r: e => { e.hp -= 8; S.xin += 15; S.st = '静'; return '你闭目调息，心猿稍敛，造成 8 点伤害。'; } }
  ],
  act: () => { let d = S.xin < 30 ? 22 : 12; if (S.st === '静') d = d / 2 | 0; S.hp -= d; return `心魔扑来，你受到 ${d} 点伤害。` + (S.xin < 30 ? '（心境过低，心魔狂躁！）' : ''); }
};
function ch1() {
  show('第一章 · 石破天惊', 'qi', '警幻仙林·醒来',
    '你在警幻仙林的补天灵石旁醒来，不记得自己是谁。体内灵力翻涌，镇后水帘瀑布轰鸣不止。\n老村长拄杖而来：“灵力失控，是心猿意马。随我入水帘洞，降伏它。”',
    [['随老村长踏入水帘洞', () => fight(foe1, ch1b)]]);
}
function ch1b() {
  add('qi', 2); S.hp += 30; S.xin = 100;
  show('第一章 · 石破天惊', 'qi', '降伏心猿', '赤尻马猴化作一缕灵光没入你体内，瀑布恢复平静。老村长颔首：“修仙，先降伏心猿。”\n你学会了「战意」与「静心」两种姿态。（齐天 +2）',
    [['前往桃园水陆埠', ch2]]);
}

/* 第二章 · 三国：兵法与结义 */
function ch2() {
  show('第二章 · 桃园结义', 'lo', '桃园水陆埠',
    '镇上大旱。刘氏铁匠铺、曹氏镖局、孙氏船帮为水权剑拔弩张，魔气正乘虚渗入。\n一位刘姓少年散修拦住你：“兄台，可愿与我一同平息此事？”', [
      ['以义相劝，三家共治', () => { add('lo', 2); add('hong', 1); puzzle(); }, '龙图 +2　红楼 +1'],
      ['先破魔气，再立规矩', () => { add('lo', 1); add('qi', 2); puzzle(); }, '龙图 +1　齐天 +2']
    ]);
}
function puzzle() {
  const ok = ['观星象，察风向', '登坛祭东风', '纵火船顺风冲阵']; let p = 0;
  const draw = m => show('第二章 · 借东风', 'lo', '兵法解密',
    `魔军连营相接，唯有火攻可破。须依序行事（已完成 ${p}/3）。${m}`,
    ['纵火船顺风冲阵', '观星象，察风向', '登坛祭东风'].map(l => [l, () => {
      if (l === ok[p]) { p++; if (p === 3) return oath(); draw('\n天时应验，再进一步。'); }
      else { p = 0; draw('\n次序有误，风向未顺，一切重来。（提示：先知天时，再借风，后用火）'); }
    }]));
  draw('');
}
function oath() {
  add('lo', 1);
  show('第二章 · 桃园结义', 'lo', '结义誓约', '东风骤起，火船如龙，魔军溃散。桃花树下，你与刘姓少年对天盟誓：“不求同年同月同日生，但求同年同月同日死。”\n（解锁同伴合击技，龙图 +1）',
    [['前往警幻仙林', ch3]]);
}

/* 第三章 · 红楼：太虚幻境 */
function ch3() {
  const c = [
    ['顺应情感·圆她一场梦', () => { S.dao = '入世'; add('hong', 2); add('lo', 1); ch3b(); }, '道心入世　红楼 +2　龙图 +1'],
    ['斩断执念·唤她看破', () => { S.dao = '出世'; add('hong', 3); ch3b(); }, '道心出世　红楼 +3']
  ];
  if (S.run > 1) c.push(['前世警示：以旧忆同渡执念与生死', () => { S.dao = '三才'; add('hong', 2); add('qi', 1); add('lo', 1); ch3b(); }, '二周目专属']);
  show('第三章 · 太虚一梦', 'hong', '警幻仙林',
    '瘴气骤起，镇上林家小姐昏迷不醒。你将通灵宝玉嵌入她的梦境，踏入太虚幻境。\n石壁上浮现她的判词与前世执念：一段未尽的缘分，一场不肯醒的梦。\n你当如何？', c);
}
function ch3b() {
  show('第三章 · 太虚一梦', 'hong', '梦醒', `林小姐悠悠转醒，瘴气散去。你悟得：“假作真时真亦假，无为有处有还无。”\n道心倾向：${S.dao}。已解锁诗词炼丹与音律副职业。`, [['继续', ch4]]);
}

/* 第四章 · 三典合一：九幽魔将与天劫 */
const mv = (l, s, m, key) => ({ l, s, r: e => {
  const d = m < 0 ? 12 : (m === e.k ? 30 : 8);
  e.ok = m === e.k; if (e.ok && key) add(key, 1);
  e.hp -= d;
  return e.ok ? `你识破招式，造成 ${d} 点伤害！` : `你出手造成 ${d} 点伤害。`;
} });
const foe4 = {
  chap: '第四章 · 天劫临门', book: 'qi', name: '九幽魔将', hp: 110,
  intro: '九幽魔将撕开夜幕，直取补天石核心！融会三典所学，方能破之。\n看清它的招式，再用对应的功法克制。',
  hint: e => ['魔将身化万千幻影，真假难辨……', '魔将驱动魔兵列阵冲杀……', '魔将掌中魔焰翻涌，神通将发……'][e.hk],
  moves: [mv('看破虚实', '红楼 · 克幻影', 0, 'hong'), mv('八阵图', '三国 · 克军阵', 1, 'lo'), mv('神通变化', '西游 · 克神通', 2, 'qi'), mv('普通攻击', '稳妥，伤害较低', -1)],
  act: e => { if (e.ok) return '魔将一击落空，被你反震。'; S.hp -= 20; return '魔将一击命中，你受到 20 点伤害。'; }
};
function ch4() {
  show('第四章 · 天劫临门', 'qi', '大荒镇危', '九幽魔将袭击大荒镇，意图夺取补天石核心。镇民慌乱，你立于桃园之前。', [['迎战魔将', () => fight(foe4, tribulation)]]);
}
function tribulation() {
  show('第四章 · 天劫临门', 'qi', '第一道雷劫', '魔将伏诛，天空骤暗，第一道雷劫自九霄劈下。你选择如何渡劫？', [
    ['硬抗雷霆，不退半步', () => { add('qi', 2); ending(); }, '齐天 +2'],
    ['布八阵引雷入地', () => { add('lo', 2); ending(); }, '龙图 +2'],
    ['心如止水，观雷如幻', () => { add('hong', 2); ending(); }, '红楼 +2']
  ]);
}

/* 终章：三道天心值判定 */
function ending() {
  const m = Math.max(S.qi, S.lo, S.hong), top = ['qi', 'lo', 'hong'].filter(k => S[k] === m);
  const T = { qi: '斗战破天·齐天大圣——“若天压我，劈开那天！”', lo: '鼎立秩序·人皇治世——“天下大势，合力者胜。”', hong: '太虚归真·梦觉补天——“假作真时真亦假。”' };
  const tri = S.run > 1 && S.qi >= 4 && S.lo >= 4 && S.hong >= 4;
  const end = tri ? '三才归一·混沌重开（隐藏真结局之兆）' : top.length > 1 ? '三道均衡——抵达无稽崖时，将由你亲手抉择天道走向。' : '终局走向：' + T[top[0]];
  show('新手村 · 终章', 'hong', '渡劫成功',
    `雷劫散尽，大荒桃源镇化作大地图上的一处据点。你收到“四大部洲”通缉令与邀请函，正式下山入世。\n\n道心：${S.dao || '未定'}　齐天 ${S.qi}　龙图 ${S.lo}　红楼 ${S.hong}\n${end}`,
    [...trigs().map(a => ['天道坍塌 · ' + a.n, () => anRun(a), '暗线 · ' + a.need.join(' + ')]), ['下山 · 前往东胜神洲', zhou1, '筑基期 · 仙源寻踪']]);
}
function reborn(M = 1) {
  Object.assign(S, { hp: 100, xin: 100, qi: S.qi >> 1, lo: S.lo >> 1, hong: S.hong >> 1, dao: '', st: '', run: S.run + 1, M, m1: 0, m2: 0, realm: '', ally: '' });
  intro();
}

/* 东胜神洲 · 仙源寻踪（筑基→金丹） */
function quiz(chap, book, title, qs, done) {
  let i = 0;
  const ask = m => {
    if (i >= qs.length) return done();
    const [q, o, a] = qs[i];
    show(chap, book, title, (m ? m + '\n\n' : '') + q, o.map(t => [t, () => {
      if (t === a) { i++; ask(i < qs.length ? '心法应验。' : ''); }
      else { S.xin -= 10; ask('心法不应，心境 -10。再想想。'); }
    }]));
  };
  ask('');
}
function zhou1() {
  S.realm = '筑基期'; S.m1 = S.m2 = 0;
  hub('你带着补天石碎片下山，来到东胜神洲。此地灵气最浓，却被“贾、史、王、薛”四大世家与袁氏仙宗垄断灵脉——散修渡劫，天雷由他们操控。\n你需要一条不受世家掌控的野灵脉。');
}
function hub(t) {
  const c = [];
  if (!S.m1) c.push(['花果山遗迹', huaguo, '解开齐天大圣留下的心法残页']);
  if (!S.m2) c.push(['大观园秘境', daguan, '金陵赏花大会，暗藏炼丹药引']);
  if (S.m1 && S.m2) c.push(['夺取野灵脉 · 冲击金丹', () => fight(foe5, jindan), '袁氏金丹长老拦路']);
  show('东胜神洲 · 仙源寻踪', 'qi', '东胜神洲', t, c);
}
function huaguo() {
  quiz('东胜神洲 · 花果山遗迹', 'qi', '心法残页', [
    ['花果山封印之下，石壁浮现齐天大圣的心法残页，字迹残缺，须补全方能开启：\n混沌未分天地乱，茫茫渺渺（　）', ['万象生', '无人见', '难辨认'], '无人见'],
    ['自从盘古破鸿蒙，开辟从兹（　）', ['日月明', '乾坤定', '清浊辨'], '清浊辨']
  ], () => { add('qi', 2); S.m1 = 1; hub('残页化光入体，你习得「逆天心法」，并在山腹寻得一条不受世家控制的野灵脉。（齐天 +2）'); });
}
function daguan() {
  quiz('东胜神洲 · 大观园秘境', 'hong', '金陵赏花大会', [
    ['赏花会下暗设炼丹祭坛，石壁刻着判词：“玉带林中挂，金簪雪里埋。”\n“金簪雪里埋”暗指何人？', ['林黛玉', '薛宝钗', '王熙凤'], '薛宝钗']
  ], () => show('东胜神洲 · 大观园秘境', 'hong', '救下药引',
